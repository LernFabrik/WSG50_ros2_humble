name: ROS 2 Humble

on:
  push:
    branches: [humble]
  pull_request:
    branches: [humble]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies
        run: |
          sudo apt-get update
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro humble -r -y

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --build-base build-${{ matrix.build_type }} \
            --install-base install-${{ matrix.build_type }} \
            --cmake-args -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install-${{ matrix.build_type }}/setup.bash
          colcon test \
            --build-base build-${{ matrix.build_type }} \
            --install-base install-${{ matrix.build_type }} \
            --event-handlers console_direct+
          colcon test-result --test-result-base build-${{ matrix.build_type }} --verbose

  sanitizers:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies
        run: |
          sudo apt-get update
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro humble -r -y

      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --build-base build-sanitizers \
            --install-base install-sanitizers \
            --packages-up-to wsg50_driver \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=Debug \
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined \
              -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined

      - name: Run transport tests with sanitizers
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          source /opt/ros/humble/setup.bash
          source install-sanitizers/setup.bash
          colcon test \
            --build-base build-sanitizers \
            --install-base install-sanitizers \
            --packages-select wsg50_driver \
            --ctest-args -R test_transport --output-on-failure
          colcon test-result --test-result-base build-sanitizers --verbose
